<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản Sinh Viên - EduMarket</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page-bg {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #38bdf8 100%);
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      padding: 40px 0;
    }
    .auth-box-wrap {
      background: #ffffff;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-modal);
      padding: 35px 40px;
      width: 100%;
      max-width: 550px;
      margin: 0 auto;
    }
    .auth-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <!-- HEADER AUTH TỐI GIẢN -->
  <header style="background: #ffffff; border-bottom: 1px solid var(--border-color); padding: 16px 0;">
    <div class="container d-flex align-center justify-between">
      <div class="d-flex align-center gap-3">
        <a href="trangchu.html" class="d-flex align-center gap-2" style="color: var(--color-primary);">
          <i class="fa-solid fa-book-open-reader" style="font-size: 2rem;"></i>
          <span style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">EduMarket</span>
        </a>
        <span style="font-size: 1.25rem; font-weight: 600; color: var(--text-main); margin-left: 8px;">Đăng Ký Tài Khoản</span>
      </div>
      <div>
        <a href="sitemap.html" class="text-primary fw-medium" style="font-size: 0.9rem;">Trợ giúp?</a>
      </div>
    </div>
  </header>

  <!-- FORM CONTAINER -->
  <main class="auth-page-bg">
    <div class="container">
      <div class="auth-box-wrap">
        <h1 class="auth-title">Đăng Ký Tài Khoản Sinh Viên</h1>
        <p class="auth-sub">Tạo tài khoản để nhận ngay hạn mức Ví trả sau 500.000 đ & mở gian hàng bán đồ miễn phí!</p>

        <form id="form-register">
          <div class="form-group">
            <label class="form-label">Tên đăng nhập *</label>
            <input type="text" id="reg-username" class="form-input" placeholder="Ví dụ: nam_sinhvien" required>
          </div>

          <div class="form-group">
            <label class="form-label">Họ và tên đầy đủ *</label>
            <input type="text" id="reg-fullname" class="form-input" placeholder="Ví dụ: Lê Hoàng Nam" required>
          </div>

          <div class="form-group">
            <label class="form-label">Mã số sinh viên (MSSV) *</label>
            <input type="text" id="reg-mssv" class="form-input" placeholder="Ví dụ: 20221234 (để nhận voucher giảm 20k)" required>
          </div>

          <div class="d-flex gap-3">
            <div class="form-group flex-1">
              <label class="form-label">Email trường / cá nhân *</label>
              <input type="email" id="reg-email" class="form-input" placeholder="sinhvien@edu.vn" required>
            </div>
            <div class="form-group flex-1">
              <label class="form-label">Số điện thoại *</label>
              <input type="text" id="reg-phone" class="form-input" placeholder="0987654321 (10 số)" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Tên gian hàng người bán của bạn (tùy chọn)</label>
            <input type="text" id="reg-shopname" class="form-input" placeholder="Ví dụ: Tiệm Đồ Dùng KTX Phòng 302">
          </div>

          <div class="d-flex gap-3">
            <div class="form-group flex-1">
              <label class="form-label">Mật khẩu *</label>
              <input type="password" id="reg-password" class="form-input" placeholder="Tối thiểu 6 ký tự" required>
            </div>
            <div class="form-group flex-1">
              <label class="form-label">Xác nhận mật khẩu *</label>
              <input type="password" id="reg-confirm-password" class="form-input" placeholder="Nhập lại mật khẩu" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg mt-3">
            ĐĂNG KÝ NGAY
          </button>
        </form>

        <div class="text-center mt-4" style="font-size: 0.9rem;">
          <span class="text-muted">Bạn đã có tài khoản?</span>
          <a href="dangnhap.html" class="text-primary fw-bold" style="margin-left: 5px;">Đăng Nhập</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-bottom" style="background: #ffffff; padding: 20px 0;">
    <div class="container text-center">
      <p>© 2026 EduMarket - Đồ án môn học: Hệ thống & Công nghệ Web.</p>
    </div>
  </footer>

  <script src="js/core/model/seed-data.js"></script>
  <script src="js/core/model/api-config.js"></script>
  <script src="js/core/model/api-client.js"></script>
  <script src="js/core/model/storage.js"></script>
  <script src="js/modules/catalog/model/product-service.js"></script>
  <script src="js/modules/catalog/model/category-service.js"></script>
  <script src="js/modules/cart/model/cart-service.js"></script>
  <script src="js/modules/orders/model/order-service.js"></script>
  <script src="js/modules/product-detail/model/review-service.js"></script>
  <script src="js/modules/wishlist/model/wishlist-service.js"></script>
  <script src="js/modules/auth/model/user-service.js"></script>
  <script src="js/core/model/format-helper.js"></script>
  <script src="js/core/view/toast-view.js"></script>
  <script src="js/modules/shared/view/product-card-view.js"></script>
  <script src="js/modules/shared/view/header-view.js"></script>
  <script src="js/modules/shared/controller/header-controller.js"></script>
  <script src="js/modules/auth/controller/auth-controller.js"></script>
</body>
</html>
